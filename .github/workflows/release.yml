name: Release

on:
  push:
    tags:
      - "*"

# Default GITHUB_TOKEN is read-only on this repo; the release step needs write
# access to create the GitHub release.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run build

      - name: Stage release assets
        run: |
          mkdir dist
          cp main.js manifest.json dist/
          [ -s styles.css ] && cp styles.css dist/ || true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
